<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>秃秃 · 一日一菇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#f6ece0;color:#4a3b33;display:flex;justify-content:center;overscroll-behavior:none;
}
.app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fdf9f3 0%,#f9efe2 100%);position:relative;overflow:hidden}

/* ---------- 顶部 ---------- */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;z-index:5}
.who{display:flex;flex-direction:column;gap:2px}
.nm{font-size:19px;font-weight:800;letter-spacing:.5px}
.nm small{font-size:11px;font-weight:600;color:#a8917e;margin-left:6px;letter-spacing:0}
.sub{font-size:11.5px;color:#a8917e}
.clock{font-size:12px;color:#a8917e;text-align:right;line-height:1.5}

/* ---------- 场景 ---------- */
.stage{position:relative;flex:1;min-height:250px;overflow:hidden}
.sky{position:absolute;inset:0;transition:background .8s ease}
body[data-scene="grass"] .sky{background:linear-gradient(180deg,#dff0f7 0%,#f4f6ea 55%,#eaf0dd 100%)}
body[data-scene="window"] .sky{background:linear-gradient(180deg,#ffe9d6 0%,#fbe3cf 45%,#f2dcc6 100%)}
body[data-scene="night"] .sky{background:linear-gradient(180deg,#2b3355 0%,#3c4670 45%,#4c5578 100%)}
body[data-scene="night"] .nm,body[data-scene="night"] .sub,body[data-scene="night"] .clock{color:#f2e6d8}
body[data-scene="night"] .nm small{color:#c9b8a6}
body[data-scene="night"] .app{background:linear-gradient(180deg,#2b3355,#3c4670)}

.sun{position:absolute;top:14%;right:12%;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle,#ffe9a8,#ffd166);box-shadow:0 0 34px rgba(255,209,102,.6)}
body[data-scene="night"] .sun{background:radial-gradient(circle,#fff8e6,#f3ead6);box-shadow:0 0 26px rgba(255,248,230,.5)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;filter:blur(.2px)}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:64px;height:22px;top:16%;left:-80px;animation:drift 34s linear infinite}
.c1:before{width:30px;height:30px;top:-14px;left:10px}
.c1:after{width:22px;height:22px;top:-10px;left:36px}
.c2{width:46px;height:16px;top:30%;left:-70px;animation:drift 46s linear infinite 6s;opacity:.6}
.c2:before{width:22px;height:22px;top:-10px;left:8px}
@keyframes drift{to{transform:translateX(620px)}}
.stars{position:absolute;inset:0;opacity:0;transition:opacity .8s}
body[data-scene="night"] .stars{opacity:1}
.stars i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

.ground{position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;border-radius:50% 50% 0 0;
  background:linear-gradient(180deg,#cfe3c2,#bcd6ac);transition:background .8s}
body[data-scene="window"] .ground{background:linear-gradient(180deg,#e6cdb4,#d9b99c);height:26%}
body[data-scene="night"] .ground{background:linear-gradient(180deg,#3f4a6b,#35405c)}

/* ---------- 蘑菇 ---------- */
.pet-wrap{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);
  width:190px;height:200px;animation:breathe 3.6s ease-in-out infinite;will-change:transform}
.pet-wrap svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 12px 14px rgba(120,80,60,.18))}
@keyframes breathe{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}
  50%{transform:translateX(-50%) translateY(-5px) scale(1.012)}}
.pet-wrap[data-anim="bounce"]{animation:bounce .62s ease-in-out 3}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}
  40%{transform:translateX(-50%) translateY(-30px) rotate(-3deg)}
  70%{transform:translateX(-50%) translateY(-6px) rotate(2deg)}}
.pet-wrap[data-anim="sway"]{animation:sway 1.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-3.5deg)}
  50%{transform:translateX(-50%) rotate(3.5deg)}}
.pet-wrap[data-anim="walk"]{animation:walk 2.6s ease-in-out}
@keyframes walk{0%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 26px)) rotate(-4deg)}
  70%{transform:translateX(calc(-50% + 26px)) rotate(4deg)}100%{transform:translateX(-50%)}}
.pet-wrap[data-anim="sleep"]{animation:sleep 4.2s ease-in-out infinite}
@keyframes sleep{0%,100%{transform:translateX(-50%) translateY(0) scaleY(.97)}
  50%{transform:translateX(-50%) translateY(4px) scaleY(.94)}}
.pet-wrap[data-anim="eat"]{animation:eat .46s ease-in-out 5}
@keyframes eat{0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.05,.95)}}

/* 表情控制 */
#pet [class^="eyes-"],#pet .mouth-normal,#pet .mouth-open,#pet .mouth-sad{display:none}
#pet[data-face="normal"] .eyes-open,#pet[data-face="hungry"] .eyes-open,#pet[data-face="surprised"] .eyes-open{display:block}
#pet[data-face="happy"] .eyes-happy,#pet[data-face="shy"] .eyes-happy,#pet[data-face="eat"] .eyes-happy{display:block}
#pet[data-face="sleep"] .eyes-sleep{display:block}
#pet[data-face="love"] .eyes-love{display:block}
#pet[data-face="normal"] .mouth-normal,#pet[data-face="sleep"] .mouth-normal,#pet[data-face="shy"] .mouth-normal{display:block}
#pet[data-face="happy"] .mouth-open,#pet[data-face="surprised"] .mouth-open,
#pet[data-face="love"] .mouth-open,#pet[data-face="eat"] .mouth-open{display:block}
#pet[data-face="hungry"] .mouth-sad{display:block}

/* 气泡 */
.bubble{position:absolute;left:50%;top:6%;transform:translate(-50%,6px);
  max-width:250px;background:#fffdf8;border:1px solid #f0e2d2;border-radius:16px;
  padding:9px 14px;font-size:13px;line-height:1.55;color:#5b4638;
  box-shadow:0 8px 20px rgba(140,100,70,.12);opacity:0;transition:.28s;pointer-events:none;z-index:4;text-align:center}
.bubble.on{opacity:1;transform:translate(-50%,0)}
.bubble:after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;
  width:14px;height:14px;background:#fffdf8;border-right:1px solid #f0e2d2;border-bottom:1px solid #f0e2d2;transform:rotate(45deg)}

/* 特效 */
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.heart,.crumb{position:absolute;font-size:16px;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8)}
  100%{opacity:0;transform:translateY(-70px) scale(1.15)}}

/* ---------- 状态 ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;padding:10px 20px 4px}
.stat{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8a7566}
.stat .ic{width:15px;text-align:center}
.bar{flex:1;height:7px;background:#efe3d6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
#bMood i{background:linear-gradient(90deg,#ffb3a0,#f0876b)}
#bFull i{background:linear-gradient(90deg,#ffd98e,#f0b45c)}
#bEnergy i{background:linear-gradient(90deg,#a8d8c0,#6fb894)}
#bBond i{background:linear-gradient(90deg,#c8b6e8,#9b7fd4)}

/* ---------- 操作 ---------- */
.actions{display:flex;justify-content:space-between;padding:8px 16px 4px;gap:8px}
.act{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:0;font-family:inherit;cursor:pointer;color:#7a6555;padding:6px 0;border-radius:14px;transition:.18s}
.act:active{transform:scale(.93);background:#f7ead9}
.act .em{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:#fffdf8;border:1px solid #f0e2d2;box-shadow:0 4px 12px rgba(150,110,80,.1)}
.act span{font-size:10.5px;font-weight:600}
.mini{display:flex;justify-content:center;gap:8px;padding:4px 16px 10px}
.mini button{border:1px solid #eadbc9;background:#fffdf8;color:#8a7566;font-family:inherit;
  font-size:11px;font-weight:600;padding:6px 13px;border-radius:99px;cursor:pointer}
.mini button:active{background:#f7ead9}

/* ---------- 面板 ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fffdf9;border-radius:22px 22px 0 0;
  box-shadow:0 -10px 34px rgba(120,85,60,.18);padding:16px 18px 22px;z-index:20;
  transform:translateY(110%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:72%;overflow:auto}
.sheet.on{transform:translateY(0)}
.sheet h3{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:#f4e8da;color:#8a7566;font-family:inherit;font-size:11px;
  padding:4px 10px;border-radius:99px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.opt{background:#fbf3e8;border:1.5px solid transparent;border-radius:14px;padding:10px 4px;
  text-align:center;font-size:10.5px;color:#7a6555;cursor:pointer;position:relative}
.opt .e{font-size:21px;display:block;margin-bottom:3px}
.opt.sel{border-color:#f0876b;background:#fff2ec}
.opt.lock{opacity:.42}
.opt.lock:after{content:"🔒";position:absolute;top:3px;right:4px;font-size:9px}
.diary{font-size:12px;line-height:1.9;color:#6b5647}
.diary li{list-style:none;padding-left:16px;position:relative}
.diary li:before{content:"·";position:absolute;left:4px;color:#c9a98c}
.diary .empty{color:#b3a294;font-size:12px}
.talkbox{display:flex;gap:8px;margin-top:4px}
.talkbox input{flex:1;border:1px solid #eadbc9;background:#fbf3e8;border-radius:99px;
  padding:10px 15px;font-size:13px;font-family:inherit;color:#5b4638;outline:none}
.talkbox input:focus{border-color:#f0b49b}
.talkbox button{border:0;background:#f0876b;color:#fff;font-family:inherit;font-weight:700;
  font-size:13px;padding:0 18px;border-radius:99px}
footer{text-align:center;font-size:10px;color:#b9a795;padding-bottom:8px}
</style>
</head>

<script>
(function(){
  "use strict";

  var KEY = "tutu_mushroom_v1";
  var STAGES = [
    {min:0,  name:"孢子期",  tip:"刚来到你身边，还小小的"},
    {min:5,  name:"小菇芽",  tip:"开始认人了"},
    {min:15, name:"圆头菇",  tip:"伞盖圆起来了"},
    {min:30, name:"胖胖菇",  tip:"长胖了一点点"},
    {min:60, name:"开花菇",  tip:"头上开出了一朵花"}
  ];

  function todayKey(){
    var d = new Date();
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }

  var S = load();

  function load(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){}
    var s = raw ? JSON.parse(raw) : null;
    if(!s || typeof s !== "object"){
      s = {
        born: Date.now(), lastSeen: Date.now(),
        mood: 72, full: 70, energy: 82, bond: 0, exp: 0,
        hat: "", scarf: "", flower: false, scene: "grass",
        day: todayKey(), diary: [],
        c: {feed:0, pet:0, play:0, talk:0},
        lastTalk: 0, greeted: false
      };
    }
    // 补字段
    s.c = s.c || {feed:0, pet:0, play:0, talk:0};
    s.diary = s.diary || [];
    if(s.day !== todayKey()){ s.day = todayKey(); s.diary = []; }
    return s;
  }

  function save(){
    S.lastSeen = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  }

  /* ---------- 离线结算 ---------- */
  function settleOffline(){
    var hrs = (Date.now() - (S.lastSeen || Date.now())) / 3600000;
    if(hrs <= 0) return 0;
    hrs = Math.min(hrs, 24);
    S.full   = clamp(S.full   - hrs * 7);
    S.energy = clamp(S.energy - hrs * 3);
    if(S.full < 30) S.mood = clamp(S.mood - hrs * 3);
    if(hrs > 0.5){
      if(S.full < 35) S.mood = clamp(S.mood - 4);
    }
    return hrs;
  }

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  /* ---------- 台词 ---------- */
  var LINES = {
    greetLong: ["你回来啦。我刚才一直在数云。","你不在的时候，我睡了一小会儿。","我刚刚还想着，你会不会来。"],
    greetShort: ["你来啦。","嗯，我在。","今天也见面了。"],
    idle: ["今天的风是甜的。","我在想，蘑菇会不会做梦。","伞盖好像又圆了一点点。","安静的时候，能听见你手机在呼吸。","我不吵你，我就待在这儿。"],
    feed: ["唔……好甜。你要不要也吃一口？","这个味道我要记住。","慢慢吃，不着急。","吃饱了，伞盖都亮了一点。"],
    pet: ["诶……再摸一下也不是不行。","别停呀。","你的手是暖的。","再摸，我就要害羞了。"],
    play: ["再来！我这次一定接得住！","跑起来的时候，风会从伞盖下面钻过去。","好玩，但有点累。","你笑起来的时候，我也开心。"],
    hungry: ["肚子有点空空的……","我不催你，我就是看看你。","要是有一小块饼干就好了。"],
    sleepy: ["眼睛要黏在一起了……","我眯一会儿，你别走太远。","困……"],
    love: ["那我把伞盖借你躲雨。","你这样说，我会当真的。","嗯，我也喜欢你。"],
    night: ["天黑了，你也早点睡。","夜里凉，记得盖被子。"],
    wake: ["唔……我醒了。","刚才梦到一颗很大的露水。"]
  };

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  /* ---------- DOM ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var pet = $("pet"), wrap = $("petWrap"), bubble = $("bubble"), fx = $("fx");
  var sheet = $("sheet"), sheetTitle = $("sheetTitle"), sheetBody = $("sheetBody");

  /* 星星 */
  (function(){
    var box = $("stars"), html = "";
    for(var i=0;i<26;i++){
      html += '<i style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*58).toFixed(1)+'%;animation-delay:'+(Math.random()*3).toFixed(1)+'s"></i>';
    }
    box.innerHTML = html;
  })();

  /* ---------- 渲染 ---------- */
  function stageInfo(){
    var e = S.exp, st = STAGES[0];
    for(var i=0;i<STAGES.length;i++){ if(e >= STAGES[i].min) st = STAGES[i]; }
    return st;
  }

  function render(){
    $("bMood").firstChild.style.width = S.mood + "%";
    $("bFull").firstChild.style.width = S.full + "%";
    $("bEnergy").firstChild.style.width = S.energy + "%";
    $("bBond").firstChild.style.width = Math.min(100, S.bond) + "%";

    var st = stageInfo();
    $("stageName").textContent = st.name;
    var days = Math.max(1, Math.floor((Date.now() - S.born) / 86400000) + 1);
    $("dayText").textContent = "相处的第 " + days + " 天";

    document.body.setAttribute("data-scene", S.scene || "grass");
    $("hatA").style.display = (S.hat === "A") ? "" : "none";
    $("hatB").style.display = (S.hat === "B") ? "" : "none";
    $("scarfG").style.display = (S.scarf === "s") ? "" : "none";
    $("flowerG").style.display = S.flower ? "" : "none";
    $("clock").textContent = clockText();
  }

  function clockText(){
    var h = new Date().getHours();
    if(h < 6) return "夜深了";
    if(h < 11) return "早上好";
    if(h < 14) return "中午好";
    if(h < 18) return "下午好";
    if(h < 22) return "晚上好";
    return "该睡啦";
  }

  function say(text, ms){
    bubble.textContent = text;
    bubble.classList.add("on");
    clearTimeout(say._t);
    say._t = setTimeout(function(){ bubble.classList.remove("on"); }, ms || 4200);
  }

  function face(f, ms){
    pet.setAttribute("data-face", f);
    if(ms){
      clearTimeout(face._t);
      face._t = setTimeout(function(){ pet.setAttribute("data-face", baseFace()); }, ms);
    }
  }

  function baseFace(){
    if(S.energy < 22) return "sleep";
    if(S.full < 25) return "hungry";
    if(S.mood > 82) return "happy";
    return "normal";
  }

  function anim(a, ms){
    wrap.setAttribute("data-anim", a);
    clearTimeout(anim._t);
    if(ms){
      anim._t = setTimeout(function(){ wrap.setAttribute("data-anim", "none"); }, ms);
    }
  }

  function popFx(kind){
    var el = document.createElement("div");
    el.className = (kind === "heart") ? "heart" : "crumb";
    el.textContent = (kind === "heart") ? "💗" : "🍪";
    el.style.left = (44 + Math.random()*22) + "%";
    el.style.top  = (38 + Math.random()*14) + "%";
    fx.appendChild(el);
    setTimeout(function(){ el.remove(); }, 1600);
  }

  /* ---------- 互动 ---------- */
  function addExp(n){
    var before = stageInfo().name;
    S.exp += n;
    S.bond = Math.min(100, S.bond + n * 0.8);
    var after = stageInfo().name;
    if(before !== after){
      setTimeout(function(){ say("我好像……长大了一点。现在是「" + after + "」了。", 5200); }, 1400);
      addDiary("我长大了，进入「" + after + "」");
      // 成长解锁
      if(after === "小菇芽" && !S.hat) S.hat = "A";
      if(after === "圆头菇") S.scarf = "s";
      if(after === "胖胖菇") S.flower = true;
      if(after === "开花菇") S.scene = S.scene || "grass";
    }
  }

  function addDiary(text){
    if(S.day !== todayKey()){ S.day = todayKey(); S.diary = []; }
    var d = new Date();
    var t = ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
    S.diary.push(t + " " + text);
    if(S.diary.length > 8) S.diary.shift();
  }

  function doFeed(){
    if(S.full > 95){ say("我吃得很饱啦，等会儿再吃。"); face("happy", 2000); return; }
    S.full = clamp(S.full + 24);
    S.mood = clamp(S.mood + 7);
    S.energy = clamp(S.energy + 4);
    S.c.feed++;
    anim("eat", 2400);
    face("eat", 2400);
    popFx("crumb");
    say(pick(LINES.feed));
    addExp(1);
    addDiary("你喂我吃了小饼干");
    save(); render();
  }

  function doPet(){
    S.mood = clamp(S.mood + 9);
    S.bond = Math.min(100, S.bond + 1.6);
    S.c.pet++;
    anim("sway", 1500);
    face("shy", 2200);
    popFx("heart");
    say(pick(LINES.pet));
    addExp(1);
    addDiary("你摸了摸我");
    save(); render();
  }

  function doPlay(){
    if(S.energy < 18){ say("我有点没力气了，让我歇一会儿。"); face("sleep", 2000); return; }
    S.energy = clamp(S.energy - 14);
    S.mood = clamp(S.mood + 14);
    S.full = clamp(S.full - 4);
    S.bond = Math.min(100, S.bond + 2.4);
    S.c.play++;
    anim("bounce", 1900);
    face("love", 2200);
    say(pick(LINES.play));
    addExp(2);
    addDiary("我们一起玩了小球");
    save(); render();
  }

  function doTalk(){
    openSheet("talk");
  }

  function replyTo(text){
    var t = (text || "").trim();
    if(!t) return;
    S.c.talk++;
    var low = t.toLowerCase();
    var r;
    if(/你好|嗨|在吗|hello|hi/.test(low)) r = "嗨。我一直在这儿。";
    else if(/喜欢|爱你|想你|么么/.test(low)){ r = pick(LINES.love); face("love", 2600); }
    else if(/再见|拜拜|走了|晚安/.test(low)){ r = "去吧，我等你回来。"; }
    else if(/名字|叫什么/.test(low)) r = "我叫秃秃。你取的名字，我都喜欢。";
    else if(/吃|饿|饼干|露水/.test(low)){ r = "说到吃……我确实有点饿了。"; face("hungry", 2600); }
    else if(/累|困|睡/.test(low)) r = "那我们一起歇一会儿吧。";
    else if(/今天|怎么样/.test(low)) r = "今天嘛……我在等你打开手机。";
    else if(S.c.feed > 3 && Math.random() < .35) r = "你上次喂我的饼干，我记到现在。";
    else if(S.c.play > 3 && Math.random() < .3) r = "我还想再玩一次小球。";
    else r = pick(LINES.idle);
    say(r, 5200);
    addExp(1);
    addDiary("你跟我说：「" + (t.length > 12 ? t.slice(0,12) + "…" : t) + "」");
    save(); render();
  }

  /* ---------- 自主行为 ---------- */
  var BEHAVIORS = ["look","sway","walk","dance","yawn","sit","hum"];
  function autoTick(){
    // 状态自然变化（每 20 秒）
    S.full = clamp(S.full - 0.28);
    if(S.energy < 70) S.energy = clamp(S.energy + 0.5);
    else S.energy = clamp(S.energy - 0.12);
    if(S.full < 20) S.mood = clamp(S.mood - 0.5);
    if(S.energy < 15) S.mood = clamp(S.mood - 0.3);

    // 睡觉时回精力
    if(wrap.getAttribute("data-anim") === "sleep"){
      S.energy = clamp(S.energy + 0.9);
      S.full = clamp(S.full - 0.1);
    }

    // 随机行为
    if(Math.random() < 0.3){
      var b;
      if(S.energy < 22) b = "sleep";
      else if(S.full < 25) b = "hungry";
      else b = pick(BEHAVIORS);
      perform(b);
    }
    save();
  }

  function perform(b){
    if(b === "sleep"){
      anim("sleep", 0);
      face("sleep", 0);
      if(Math.random() < .4) say(pick(LINES.sleepy), 3800);
      return;
    }
    if(b === "hungry"){
      face("hungry", 3200);
      if(Math.random() < .5) say(pick(LINES.hungry), 3800);
      return;
    }
    if(b === "look"){
      face("normal", 2200);
      pet.style.transformOrigin = "center bottom";
      return;
    }
    if(b === "sway"){
      anim("sway", 2400);
      face("happy", 2400);
      return;
    }
    if(b === "walk"){
      anim("walk", 2700);
      face("happy", 2700);
      return;
    }
    if(b === "dance"){
      anim("bounce", 1300);
      face("love", 1600);
      return;
    }
    if(b === "yawn"){
      face("sleep", 1800);
      say("啊……", 1500);
      return;
    }
    if(b === "sit" || b === "hum"){
      face("normal", 2000);
      if(Math.random() < .25) say(pick(LINES.idle), 4000);
      return;
    }
  }

  /* ---------- 面板 ---------- */
  var SHEET = {};

  function openSheet(kind){
    if(kind === "talk"){
      sheetTitle.textContent = "跟秃秃说句话";
      sheetBody.innerHTML =
        '<div class="talkbox"><input id="talkInput" maxlength="40" placeholder="随便说点什么…" /><button id="talkSend">说</button></div>' +
        '<div style="font-size:10.5px;color:#b3a294;margin-top:10px;line-height:1.7">它不一定会回答得很聪明，但它会记得你说过的话。</div>';
      sheet.classList.add("on");
      var inp = $("talkInput");
      setTimeout(function(){ inp && inp.focus(); }, 320);
      $("talkSend").onclick = function(){
        var v = inp.value;
        inp.value = "";
        sheet.classList.remove("on");
        replyTo(v);
      };
      inp.onkeydown = function(e){
        if(e.key === "Enter"){
          var v = inp.value; inp.value = "";
          sheet.classList.remove("on");
          replyTo(v);
        }
      };
      return;
    }

    if(kind === "dress"){
      sheetTitle.textContent = "给秃秃打扮";
      var hats = [
        {id:"",  e:"🚫", n:"不戴", need:0},
        {id:"A", e:"👒", n:"小草帽", need:0},
        {id:"B", e:"🧶", n:"毛线帽", need:8}
      ];
      var scarfs = [
        {id:"", e:"🚫", n:"不围", need:0},
        {id:"s", e:"🧣", n:"小围巾", need:12}
      ];
      var html = '<div style="font-size:11px;color:#a8917e;margin-bottom:7px">帽子</div><div class="opts">';
      hats.forEach(function(h){
        var lock = S.bond < h.need;
        html += '<div class="opt '+(S.hat===h.id?"sel":"")+(lock?" lock":"")+'" data-hat="'+h.id+'" data-need="'+h.need+'"><span class="e">'+h.e+'</span>'+h.n+'</div>';
      });
      html += '</div><div style="font-size:11px;color:#a8917e;margin:14px 0 7px">围巾</div><div class="opts">';
      scarfs.forEach(function(h){
        var lock = S.bond < h.need;
        html += '<div class="opt '+(S.scarf===h.id?"sel":"")+(lock?" lock":"")+'" data-scarf="'+h.id+'" data-need="'+h.need+'"><span class="e">'+h.e+'</span>'+h.n+'</div>';
      });
      html += '</div>';
      html += '<div style="font-size:11px;color:#a8917e;margin:14px 0 7px">小花</div><div class="opts">' +
        '<div class="opt '+(S.flower?"sel":"")+'" data-flower="1"><span class="e">🌸</span>开花</div>' +
        '<div class="opt '+(!S.flower?"sel":"")+'" data-flower="0"><span class="e">🚫</span>不开</div>' +
        '</div>';
      sheetBody.innerHTML = html;
      sheet.classList.add("on");
      sheetBody.querySelectorAll("[data-hat]").forEach(function(el){
        el.onclick = function(){
          if(S.bond < +el.dataset.need){ say("这个要再熟一点才给你哦。"); return; }
          S.hat = el.dataset.hat; save(); render(); openSheet("dress");
        };
      });
      sheetBody.querySelectorAll("[data-scarf]").forEach(function(el){
        el.onclick = function(){
          if(S.bond < +el.dataset.need){ say("我们再亲近一点，就给你围上。"); return; }
          S.scarf = el.dataset.scarf; save(); render(); openSheet("dress");
        };
      });
      sheetBody.querySelectorAll("[data-flower]").forEach(function(el){
        el.onclick = function(){ S.flower = el.dataset.flower === "1"; save(); render(); openSheet("dress"); };
      });
      return;
    }

    if(kind === "scene"){
      sheetTitle.textContent = "秃秃的小窝";
      var scenes = [
        {id:"grass", e:"🌿", n:"草地", need:0},
        {id:"window", e:"🪟", n:"窗台", need:10},
        {id:"night", e:"🌙", n:"星空", need:20}
      ];
      var h2 = '<div class="opts">';
      scenes.forEach(function(s){
        var lock = S.bond < s.need;
        h2 += '<div class="opt '+(S.scene===s.id?"sel":"")+(lock?" lock":"")+'" data-scene="'+s.id+'" data-need="'+s.need+'"><span class="e">'+s.e+'</span>'+s.n+'</div>';
      });
      h2 += '</div><div style="font-size:10.5px;color:#b3a294;margin-top:12px;line-height:1.7">小窝会随着你们熟悉起来慢慢解锁。</div>';
      sheetBody.innerHTML = h2;
      sheet.classList.add("on");
      sheetBody.querySelectorAll("[data-scene]").forEach(function(el){
        el.onclick = function(){
          if(S.bond < +el.dataset.need){ say("这里还去不了，我们再熟一点吧。"); return; }
          S.scene = el.dataset.scene; save(); render(); openSheet("scene");
        };
      });
      return;
    }

    if(kind === "diary"){
      sheetTitle.textContent = "今日小事";
      var html3 = '<ul class="diary">';
      if(!S.diary.length){
        html3 += '<li class="empty">今天还没有什么特别的事。要不，喂我吃点东西？</li>';
      } else {
        S.diary.slice().reverse().forEach(function(x){ html3 += "<li>" + x + "</li>"; });
      }
      html3 += "</ul>";
      html3 += '<div style="font-size:10.5px;color:#b3a294;margin-top:12px;line-height:1.7">这些是秃秃记得的今天。换一天会重新开始记。</div>';
      sheetBody.innerHTML = html3;
      sheet.classList.add("on");
      return;
    }
  }

  $("sheetClose").onclick = function(){ sheet.classList.remove("on"); };

  /* ---------- 绑定 ---------- */
  document.querySelectorAll(".act").forEach(function(b){
    b.onclick = function(){
      var d = b.dataset.do;
      if(d === "feed") doFeed();
      else if(d === "pet") doPet();
      else if(d === "play") doPlay();
      else if(d === "talk") doTalk();
    };
  });
  document.querySelectorAll("[data-sheet]").forEach(function(b){
    b.onclick = function(){ openSheet(b.dataset.sheet); };
  });

  // 点蘑菇也能摸
  wrap.onclick = function(){ doPet(); };

  /* ---------- 启动 ---------- */
  var hrsAway = settleOffline();
  render();

  // 初始问候
  setTimeout(function(){
    var h = new Date().getHours();
    var greet;
    if(hrsAway > 2) greet = pick(LINES.greetLong);
    else greet = pick(LINES.greetShort);
    if(S.full < 25) greet = pick(LINES.hungry);
    else if(h >= 22 || h < 6) greet = pick(LINES.night);
    say(greet, 5200);
    if(hrsAway > 8) addDiary("你离开了 " + Math.round(hrsAway) + " 小时，我一直在等你");
    save();
  }, 700);

  face(baseFace(), 0);

  setInterval(autoTick, 20000);
  setInterval(render, 3000);
  setInterval(function(){
    // 随机眨眼
    if(Math.random() < .35){
      pet.setAttribute("data-face", "sleep");
      setTimeout(function(){ pet.setAttribute("data-face", baseFace()); }, 160);
    }
  }, 4200);

  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) save();
  });
})();
</script>
</body>
</html>
