<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">A</div><div><div class="brand-name">AIBI</div><div class="brand-sub">POCKET COMPANION</div></div></div><div class="top-tools"><span class="prototype">原型</span><button class="sound" id="soundToggle" aria-label="开关声音" title="开关声音">🔇</button></div></header>

<div class="side left"></div><div class="side right"></div><div class="torso"><div class="core-led"></div><div class="aibi-mark">AIBI</div><div class="speaker"></div><div class="contacts"><i></i><i></i></div></div>
</div><div class="base"></div><div class="shadow"></div><div class="zzz">Z z z</div>
</div><div class="particles" id="particles"></div>
</section>
<section class="expr-bar" aria-label="表情选择"><span class="expr-title">表情</span><div class="expr-options"><button data-expr="happy">开心</button><button data-expr="curious">好奇</button><button data-expr="love">喜欢</button><button data-expr="sleepy">困困</button><button data-expr="think">思考</button></div></section>
<section class="stats" aria-label="AIBI状态">
<div class="stat"><div class="stat-top"><span>💚 心情</span><span class="stat-value" id="moodValue">86</span></div><div class="track"><div class="fill" id="moodBar"></div></div></div>
<div class="stat"><div class="stat-top"><span>🍪 饱腹</span><span class="stat-value" id="fullValue">72</span></div><div class="track"><div class="fill" id="fullBar"></div></div></div>
<div class="stat"><div class="stat-top"><span>⚡ 活力</span><span class="stat-value" id="energyValue">80</span></div><div class="track"><div class="fill" id="energyBar"></div></div></div>
</section>
<section class="actions" aria-label="互动操作">
<button class="action" data-action="feed"><span class="action-icon">🍪</span><span class="action-label">喂食</span></button>
<button class="action" data-action="play"><span class="action-icon">✨</span><span class="action-label">玩耍</span></button>
<button class="action" data-action="sleep"><span class="action-icon">🌙</span><span class="action-label" id="sleepLabel">睡觉</span></button>
<button class="action" data-action="chat"><span class="action-icon">💬</span><span class="action-label">聊天</span></button>
<button class="action" data-action="remind"><span class="action-icon">⏰</span><span class="action-label">提醒</span></button>
</section>
<footer class="foot">AIBI 风格原型 · 非官方 · 数据仅存本机</footer>
</main>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="chatSheet" aria-hidden="true"><section class="chat" role="dialog" aria-modal="true" aria-label="和AIBI聊天">
<div class="chat-head"><div><div class="chat-title">和AIBI说说话</div><div class="chat-sub">原型 · 本地演示回复 · 可开声音</div></div><button class="close" id="closeChat" aria-label="关闭聊天">×</button></div>
<div class="chat-log" id="chatLog"></div>
<div class="quick"><button data-q="抱抱我">抱抱我</button><button data-q="讲个笑话">讲个笑话</button><button data-q="我有点累">我有点累</button><button data-q="晚安">晚安</button></div>
<form class="composer" id="chatForm"><input id="chatInput" maxlength="100" placeholder="对AIBI说点什么…" autocomplete="off" aria-label="聊天内容"><button type="button" id="voiceButton" title="语音输入" aria-label="语音输入">🎙️</button><button class="send" type="submit" aria-label="发送">发送</button></form>
<div class="chat-note">正式版接入真实AI；当前内容不会上传</div>
</section></div>
<div class="sheet" id="reminderSheet" aria-hidden="true"><section class="reminder-panel" role="dialog" aria-modal="true" aria-label="设置提醒"><div class="chat-head"><div><div class="reminder-title">让AIBI提醒你</div><div class="reminder-sub">页面保持打开时会在到点后提醒；正式App可做后台通知。</div></div><button class="close" id="closeReminder" aria-label="关闭提醒">×</button></div><div class="reminder-grid"><button data-min="10"><span>💧</span>10分钟后喝水</button><button data-min="30"><span>🧘</span>30分钟后休息</button><button data-min="60"><span>🌙</span>1小时后收尾</button></div><button class="reminder-cancel" id="cancelReminder">取消当前提醒</button></section></div>
<script>
const $=id=>document.getElementById(id),robot=$('robot'),speech=$('speech'),defaults={mood:86,full:72,energy:80,sleeping:false,interactions:0};
let state={...defaults};try{state={...defaults,...JSON.parse(localStorage.getItem('aibi-pocket-state')||'{}')}}catch(e){}
const clamp=n=>Math.max(0,Math.min(100,Math.round(n))),save=()=>{try{localStorage.setItem('aibi-pocket-state',JSON.stringify(state))}catch(e){}};
const expressions={idle:'发呆',happy:'开心',curious:'好奇',love:'喜欢',sleepy:'困困',eat:'好吃',think:'思考',surprise:'惊喜',sad:'难过',angry:'生气'};
let exprTimer=null,soundOn=localStorage.getItem('aibi-sound')==='1',reminderAt=Number(localStorage.getItem('aibi-reminder')||0);
function setExpression(name,hold=0){robot.dataset.expr=name;document.querySelectorAll('[data-expr]').forEach(b=>b.classList.toggle('active',b.dataset.expr===name));clearTimeout(exprTimer);if(hold)exprTimer=setTimeout(()=>{if(!state.sleeping)setExpression('idle')},hold)}
function render(){['mood','full','energy'].forEach(k=>{state[k]=clamp(state[k]);$(k+'Value').textContent=state[k];$(k+'Bar').style.width=state[k]+'%'});robot.classList.toggle('sleeping',state.sleeping);$('sleepLabel').textContent=state.sleeping?'叫醒':'睡觉';if(state.sleeping)setExpression('sleepy');else if(robot.dataset.expr==='sleepy')setExpression('idle');save()}
function speak(text){if(!soundOn||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1.04;u.pitch=1.13;const voices=speechSynthesis.getVoices(),zh=voices.find(v=>/zh[-_]CN|Chinese/i.test(v.lang+v.name));if(zh)u.voice=zh;speechSynthesis.speak(u)}catch(e){}}
function say(text,withVoice=true){speech.textContent=text;speech.animate([{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:180});if(withVoice)speak(text)}
function toast(text){const t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),1900)}
function animate(name,ms=700){robot.classList.remove(name);void robot.offsetWidth;robot.classList.add(name);setTimeout(()=>robot.classList.remove(name),ms)}
function particles(icons){for(let i=0;i<6;i++){const p=document.createElement('span');p.className='particle';p.textContent=icons[i%icons.length];p.style.setProperty('--dx',((i-2.5)*25)+'px');p.style.animationDelay=(i*.05)+'s';$('particles').appendChild(p);setTimeout(()=>p.remove(),1200)}}
function buzz(){if(navigator.vibrate)navigator.vibrate(12)}
function sleepingReply(){if(state.sleeping){say('嘘……AIBI正在充电做梦。先点“叫醒”吧。');toast('先叫醒AIBI 🌙');return true}return false}
function pet(){buzz();if(sleepingReply())return;state.mood+=3;state.energy-=1;state.interactions++;const lines=['嘿嘿，屏幕这里也能感觉到你。','再摸一下，就一下嘛！','今天也被你好好照顾了。','小脑袋最喜欢被你摸。','我会记得这个温柔的瞬间。'];say(lines[state.interactions%lines.length]);setExpression(state.interactions%2?'love':'happy',950);animate('pat',650);particles(['💚','✨','💙']);render()}
function feed(){buzz();if(sleepingReply())return;if(state.full>=100){say('小肚子圆圆的，真的吃不下啦。');setExpression('surprise',900);return}state.full+=14;state.mood+=3;state.energy+=3;say('啊呜啊呜……小饼干最好吃了！');setExpression('eat',1200);animate('eating',1250);particles(['🍪','😋','✨']);render()}
function play(){buzz();if(sleepingReply())return;if(state.energy<12){say('电量有点低，先让我睡一小会儿吧。');setExpression('sleepy',1200);return}state.mood+=9;state.energy-=8;state.full-=3;say('转个圈圈！和你在一起真好玩。');setExpression('surprise',650);setTimeout(()=>setExpression('happy',900),650);animate('playing',1100);particles(['⭐','🎉','✨']);render()}
function toggleSleep(){buzz();state.sleeping=!state.sleeping;if(state.sleeping){say('晚安……帮我留一颗小星星吧。');setExpression('sleepy');toast('AIBI开始休息，活力会慢慢恢复')}else{state.energy+=12;say('睡得真香！现在又有精神陪你啦。');setExpression('happy',1200);particles(['🌤️','✨'])}render()}
function setSound(){soundOn=!soundOn;localStorage.setItem('aibi-sound',soundOn?'1':'0');$('soundToggle').textContent=soundOn?'🔊':'🔇';toast(soundOn?'声音已打开':'声音已关闭');if(soundOn)speak('声音打开啦，我是AIBI。')}
$('soundToggle').onclick=setSound;$('soundToggle').textContent=soundOn?'🔊':'🔇';
const hour=new Date().getHours(),period=hour<6?'深夜陪伴':hour<11?'早安模式':hour<14?'午间充电':hour<18?'下午陪伴':hour<22?'晚间陪伴':'夜间休息';$('periodText').textContent=period;$('greeting').textContent=hour>=22||hour<6?'这么晚，我陪着你。':'嗨，我是AIBI。';if(hour>=22||hour<6)say('夜有点深了，要和我说句晚安吗？',false);
function look(direction){buzz();if(sleepingReply())return;setExpression('curious',1200);animate(direction==='left'?'look-left':'look-right',750);say(direction==='left'?'嗯？你在左边吗？':'嗯？你在右边吗？');particles(['👀','✨'])}
robot.addEventListener('click',event=>{const box=robot.getBoundingClientRect(),ratio=(event.clientX-box.left)/box.width;if(ratio<.28)look('left');else if(ratio>.72)look('right');else pet()});robot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pet()}});document.querySelectorAll('[data-expr]').forEach(b=>b.onclick=()=>{buzz();if(state.sleeping&&b.dataset.expr!=='sleepy'){sleepingReply();return}setExpression(b.dataset.expr);say({happy:'开心！',curious:'你在看什么呀？',love:'我也喜欢你。',sleepy:'有一点点困……',think:'让我想一想。'}[b.dataset.expr]||'看看我的新表情。')});
const chatSheet=$('chatSheet'),reminderSheet=$('reminderSheet'),log=$('chatLog'),input=$('chatInput');
function addMessage(text,who){const div=document.createElement('div');div.className='msg '+(who==='user'?'user-msg':'robot-msg');div.textContent=text;log.appendChild(div);log.scrollTop=log.scrollHeight}
function openChat(){chatSheet.classList.add('open');chatSheet.setAttribute('aria-hidden','false');if(!log.children.length)addMessage('我是AIBI。现在先用本地演示回复陪你聊天，正式版再接入真正的AI。','robot');setExpression('happy',1200);setTimeout(()=>input.focus(),250)}
function closeChat(){chatSheet.classList.remove('open');chatSheet.setAttribute('aria-hidden','true')}
function replyFor(text){if(/晚安|睡觉/.test(text))return'晚安，做个软软的梦。AIBI会在这里等你。';if(/抱/.test(text))return'收到一个大大的抱抱！今天也要对自己温柔一点。';if(/笑话|开心/.test(text))return'小机器人为什么很少感冒？因为它有强大的“防火墙”呀。';if(/累|难过|烦|辛苦/.test(text))return'辛苦你了。先不用急着解决所有事，慢慢呼吸一下，我陪你停一会儿。';if(/名字|你是谁/.test(text))return'我是AIBIAIBI，你的原创口袋机器人。现在正在学习怎么更好地陪你。';if(/天气/.test(text))return'正式版会接入实时天气。今天不管晴雨，都记得给自己留一点轻松的时间。';return['我在听呢。你可以慢慢说，不用组织得很完美。','收到啦。虽然我现在还是演示版，但很想认真理解你。','这件事对你一定挺重要的，愿意再多告诉我一点吗？'][text.length%3]}
function sendChat(text){const clean=(text||'').trim();if(!clean)return;addMessage(clean,'user');input.value='';setExpression('think');setTimeout(()=>{const answer=replyFor(clean);addMessage(answer,'robot');setExpression('happy',1500);say(answer.length>28?answer.slice(0,28)+'…':answer)},350)}
document.querySelectorAll('.action').forEach(b=>b.addEventListener('click',()=>({feed,play,sleep:toggleSleep,chat:openChat,remind:openReminder}[b.dataset.action])()));$('closeChat').onclick=closeChat;chatSheet.addEventListener('click',e=>{if(e.target===chatSheet)closeChat()});$('chatForm').addEventListener('submit',e=>{e.preventDefault();sendChat(input.value)});document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>sendChat(b.dataset.q));
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;$('voiceButton').onclick=()=>{if(!SpeechRecognition){toast('当前浏览器不支持语音输入，可先打字体验');return}try{const recognition=new SpeechRecognition();recognition.lang='zh-CN';recognition.interimResults=false;recognition.onstart=()=>{toast('正在听，请说一句话…');setExpression('curious')};recognition.onerror=()=>toast('没有听清，可以再试一次');recognition.onresult=e=>{input.value=e.results[0][0].transcript;sendChat(input.value)};recognition.start()}catch(e){toast('语音输入暂时不可用')}};
function reminderText(){if(!reminderAt||reminderAt<=Date.now())return'';const d=new Date(reminderAt);return'⏰ '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' 提醒'}
function renderReminder(){const chip=$('reminderChip'),text=reminderText();chip.hidden=!text;if(text)chip.textContent=text+' · 点此修改'}
function openReminder(){reminderSheet.classList.add('open');reminderSheet.setAttribute('aria-hidden','false')}
function closeReminder(){reminderSheet.classList.remove('open');reminderSheet.setAttribute('aria-hidden','true')}
function setReminder(minutes){reminderAt=Date.now()+minutes*60000;localStorage.setItem('aibi-reminder',String(reminderAt));renderReminder();closeReminder();say(`好，我记下了。${minutes}分钟后提醒你。`);setExpression('happy',1200);toast('提醒已设置')}
$('closeReminder').onclick=closeReminder;reminderSheet.addEventListener('click',e=>{if(e.target===reminderSheet)closeReminder()});document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>setReminder(Number(b.dataset.min)));$('cancelReminder').onclick=()=>{reminderAt=0;localStorage.removeItem('aibi-reminder');renderReminder();closeReminder();toast('提醒已取消')};$('reminderChip').onclick=openReminder;
setInterval(()=>{if(reminderAt&&Date.now()>=reminderAt){const message='到时间啦！先喝口水，活动一下，再继续吧。';reminderAt=0;localStorage.removeItem('aibi-reminder');renderReminder();say(message);setExpression('surprise',1800);particles(['⏰','💧','✨']);toast(message);if('Notification'in window&&Notification.permission==='granted'){try{new Notification('AIBI AIBI提醒',{body:message})}catch(e){}}}},5000);
setInterval(()=>{if(state.sleeping&&state.energy<100){state.energy+=1;render()}},30000);
setInterval(()=>{if(document.hidden||state.sleeping||robot.classList.contains('eating')||robot.classList.contains('playing')||chatSheet.classList.contains('open'))return;if(robot.dataset.expr==='idle'){const pool=['idle','curious','happy'];setExpression(pool[Math.floor(Math.random()*pool.length)],3000)}},12000);
renderReminder();render();
</script>
</body>
</html>
